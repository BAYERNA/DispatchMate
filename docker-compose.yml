# FAIND 로컬 개발용 Docker Compose. 6개 런타임 전체를 한 번에 기동한다.
# (기술스택 §2.9: 데모 규모는 Docker Compose로 충분, Kubernetes는 실서비스 확장 시점의 로드맵)
# + prometheus/grafana: backend가 노출하던 /actuator/prometheus를 실제로 수집·시각화한다
# (http://localhost:3000, admin/faind).
#
# 3개 프론트엔드(admin-web/commander-tablet/responder-app)는 각자 nginx.conf로 /api, /notify,
# /socket.io, /ai-stream을 backend/notification-server/ai-server로 프록시한다 — dev server의
# vite.config.ts 프록시 규칙을 프로덕션 빌드에서 그대로 재현한 것. 브라우저는 각 앱의 nginx
# 오리진 하나만 보므로 CORS 설정이 필요 없다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: faind-postgres
    environment:
      POSTGRES_DB: faind
      POSTGRES_USER: faind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "5432:5432"
    volumes:
      - faind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faind -d faind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: faind-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/faind
      DB_USERNAME: faind
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      AI_SERVER_BASE_URL: http://ai-server:8001
      NOTIFICATION_SERVER_BASE_URL: http://notification-server:3001
      INTERNAL_WEBHOOK_TOKEN: ${INTERNAL_WEBHOOK_TOKEN:?Set INTERNAL_WEBHOOK_TOKEN in the root .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}
      # 3개 프론트엔드는 각자 nginx 오리진(8081/8082/8083)에서 서빙되는데, 브라우저는 same-origin
      # POST 요청에도 Origin 헤더를 붙인다 — backend 기본값(dev server 포트 5173~5175)만 허용하면
      # Spring Security CORS 필터가 이 요청들을 403으로 막는다. 두 세트 다 허용해야 dev/compose
      # 양쪽에서 로그인이 된다.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081,http://localhost:8082,http://localhost:8083
      # opentelemetry-spring-boot-starter는 OTLP 프로토콜 기본값이 gRPC(4317)다 — 수집기가
      # 안 떠 있어도(예: jaeger 서비스를 뺀 구성) 익스포트만 백그라운드에서 조용히 실패할 뿐
      # 기동을 막지 않는다.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-server:
    build:
      context: ./ai-server
    container_name: faind-ai-server
    environment:
      FAIND_BACKEND_BASE_URL: http://backend:8080
      FAIND_BACKEND_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in the root .env}
      FAIND_CAMERA_ALLOWED_HOSTS: ${FAIND_CAMERA_ALLOWED_HOSTS:-}
      # ai-server는 OTLP/HTTP(4318) 익스포터를 명시적으로 쓴다 — backend(gRPC/4317)와 포트가 다르다.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "8001:8001"

  notification-server:
    build:
      context: ./notification-server
    container_name: faind-notification-server
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        # alerts/alert_acknowledgements 테이블은 backend의 Flyway가 소유·생성한다 —
        # 그 마이그레이션이 끝난 뒤(healthy) 이 서비스가 떠야 매핑 대상 테이블이 존재한다.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: faind
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      DB_NAME: faind
      BACKEND_BASE_URL: http://backend:8080
      INTERNAL_WEBHOOK_TOKEN: ${INTERNAL_WEBHOOK_TOKEN:?Set INTERNAL_WEBHOOK_TOKEN in the root .env}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      VOICE_GATEWAY_URL: ${VOICE_GATEWAY_URL:-}
      MULTICHANNEL_TOKEN: ${MULTICHANNEL_TOKEN:-}
      INTERAGENCY_WEBHOOK_URL: ${INTERAGENCY_WEBHOOK_URL:-}
      INTERAGENCY_TOKEN: ${INTERAGENCY_TOKEN:-}
      PUSH_GATEWAY_URL: ${PUSH_GATEWAY_URL:-}
      # notification-server도 OTLP/HTTP(4318) 익스포터를 쓴다(ai-server와 동일 포트).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-env}
      SECURITY_FAIL_CLOSED: ${SECURITY_FAIL_CLOSED:-true}
      MTLS_CERT_PATH: ${MTLS_CERT_PATH:-}
      MTLS_KEY_PATH: ${MTLS_KEY_PATH:-}
      MTLS_CA_PATH: ${MTLS_CA_PATH:-}
      REQUIRE_PROVIDER_MTLS: ${REQUIRE_PROVIDER_MTLS:-false}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_ROLE: ${VAULT_ROLE:-}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      MULTICHANNEL_TOKEN_FILE: ${MULTICHANNEL_TOKEN_FILE:-}
      INTERAGENCY_TOKEN_FILE: ${INTERAGENCY_TOKEN_FILE:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
    ports:
      - "3001:3001"

  admin-web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    # package-lock.json이 x64 환경에서 생성돼 rolldown(vite)의 arm64-musl 네이티브 바인딩이
    # lockfile에 없다 — Apple Silicon(arm64) 호스트에서 npm ci가 그 바이너리를 못 찾아 빌드가
    # 깨지므로, x64-musl 바이너리는 lockfile에 있는 이 서비스를 amd64로 고정한다.
    platform: linux/amd64
    container_name: faind-admin-web
    depends_on:
      notification-server:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  commander-tablet:
    build:
      context: .
      dockerfile: commander-tablet/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    platform: linux/amd64
    container_name: faind-commander-tablet
    depends_on:
      backend:
        condition: service_healthy
      notification-server:
        condition: service_started
    ports:
      - "8082:80"

  responder-app:
    build:
      context: .
      dockerfile: responder-app/Dockerfile
      args:
        VITE_WEB_PUSH_PUBLIC_KEY: ${VITE_WEB_PUSH_PUBLIC_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    platform: linux/amd64
    container_name: faind-responder-app
    depends_on:
      backend:
        condition: service_healthy
      notification-server:
        condition: service_started
    ports:
      - "8083:80"

  # backend가 노출하지만 아무도 보지 않던 /actuator/prometheus(CircuitBreaker 상태 등)를
  # 실제로 시계열로 쌓고(prometheus) 대시보드로 보여준다(grafana) — 로그를 뒤지지 않고도
  # aiServer/notificationServer 서킷 open 여부를 한눈에 볼 수 있다.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: faind-prometheus
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # codex 브랜치 병합 이후 /actuator/prometheus도 다른 내부 서비스 엔드포인트와 동일하게
    # INTERNAL_SERVICE_TOKEN 없이는 503로 거부된다 — 스크레이핑에 필요한 토큰을 시크릿 파일로
    # 건네고, monitoring/prometheus.yml의 authorization.credentials_file이 그 파일을 읽는다.
    secrets:
      - internal_service_token
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: faind-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: faind
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Prometheus/Grafana(수치)와 별개로 "요청 하나가 backend→ai-server→notification-server를
  # 거치며 어디서 느려지는지"를 보여준다. all-in-one 이미지가 OTLP 수신(4317 gRPC·4318 HTTP)을
  # 기본으로 포함해 별도 collector 없이 바로 쓸 수 있다 — Prometheus/Grafana와 같은 데모 규모용
  # 단일 컨테이너 패턴.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: faind-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

volumes:
  faind-postgres-data:

secrets:
  internal_service_token:
    environment: INTERNAL_SERVICE_TOKEN
