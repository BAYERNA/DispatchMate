# FAIND 로컬 개발용 Docker Compose. 6개 런타임 전체를 한 번에 기동한다.
# (기술스택 §2.9: 데모 규모는 Docker Compose로 충분, Kubernetes는 실서비스 확장 시점의 로드맵)
#
# 3개 프론트엔드(admin-web/commander-tablet/responder-app)는 각자 nginx.conf로 /api, /notify,
# /socket.io, /ai-stream을 backend/notification-server/ai-server로 프록시한다 — dev server의
# vite.config.ts 프록시 규칙을 프로덕션 빌드에서 그대로 재현한 것. 브라우저는 각 앱의 nginx
# 오리진 하나만 보므로 CORS 설정이 필요 없다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: faind-postgres
    environment:
      POSTGRES_DB: faind
      POSTGRES_USER: faind
      POSTGRES_PASSWORD: faind
    ports:
      - "5432:5432"
    volumes:
      - faind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faind -d faind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: faind-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/faind
      DB_USERNAME: faind
      DB_PASSWORD: faind
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: faind-local-development-secret-key-change-in-production-0123456789
      AI_SERVER_BASE_URL: http://ai-server:8001
      NOTIFICATION_SERVER_BASE_URL: http://notification-server:3001
      # 3개 프론트엔드는 각자 nginx 오리진(8081/8082/8083)에서 서빙되는데, 브라우저는 same-origin
      # POST 요청에도 Origin 헤더를 붙인다 — backend 기본값(dev server 포트 5173~5175)만 허용하면
      # Spring Security CORS 필터가 이 요청들을 403으로 막는다. 두 세트 다 허용해야 dev/compose
      # 양쪽에서 로그인이 된다.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081,http://localhost:8082,http://localhost:8083
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-server:
    build:
      context: ./ai-server
    container_name: faind-ai-server
    environment:
      FAIND_BACKEND_BASE_URL: http://backend:8080
    ports:
      - "8001:8001"

  notification-server:
    build:
      context: ./notification-server
    container_name: faind-notification-server
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        # alerts/alert_acknowledgements 테이블은 backend의 Flyway가 소유·생성한다 —
        # 그 마이그레이션이 끝난 뒤(healthy) 이 서비스가 떠야 매핑 대상 테이블이 존재한다.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: faind
      DB_PASSWORD: faind
      DB_NAME: faind
      JWT_SECRET: faind-local-development-secret-key-change-in-production-0123456789
    ports:
      - "3001:3001"

  admin-web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
    # package-lock.json이 x64 환경에서 생성돼 rolldown(vite)의 arm64-musl 네이티브 바인딩이
    # lockfile에 없다 — Apple Silicon(arm64) 호스트에서 npm ci가 그 바이너리를 못 찾아 빌드가
    # 깨지므로, x64-musl 바이너리는 lockfile에 있는 이 서비스를 amd64로 고정한다.
    platform: linux/amd64
    container_name: faind-admin-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  commander-tablet:
    build:
      context: .
      dockerfile: commander-tablet/Dockerfile
    platform: linux/amd64
    container_name: faind-commander-tablet
    depends_on:
      backend:
        condition: service_healthy
      notification-server:
        condition: service_started
    ports:
      - "8082:80"

  responder-app:
    build:
      context: .
      dockerfile: responder-app/Dockerfile
    platform: linux/amd64
    container_name: faind-responder-app
    depends_on:
      backend:
        condition: service_healthy
      notification-server:
        condition: service_started
    ports:
      - "8083:80"

volumes:
  faind-postgres-data:
