plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.faind'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('resilience4jVersion', '2.2.0')
	set('springdocVersion', '2.6.0')
	set('testcontainersVersion', '1.20.4')
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Redis (DB설계서 §3.3/§3.6: 경로·ETA, 실시간 대원 상태는 Redis 우선 캐시)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Security / JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Resilience4j (CircuitBreaker for AI server / notification server calls)
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// API docs
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// OpenTelemetry — Prometheus/Grafana(수치)는 이미 있지만 "요청 하나가 backend→ai-server→
	// notification-server를 거치며 어디서 느려지는지"는 못 봤다. 공식 OTel Spring Boot 스타터는
	// OTEL_EXPORTER_OTLP_ENDPOINT가 없거나 수집기가 안 떠 있어도 익스포트만 조용히 실패할 뿐
	// (백그라운드 배치 전송, 앱 기동을 막지 않음) 안전하다 — docker-compose.yml에 새로 추가한
	// Jaeger가 없는 로컬 개발 환경에서도 기동에 영향이 없다.
	implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.11.0')
	implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'

	// Actuator (health checks per architecture diagram)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 포맷 메트릭 노출 — resilience4j-spring-boot3가 CircuitBreaker 상태를 자동으로
	// Micrometer에 등록하므로, 이 의존성 하나만 추가해도 별 코드 변경 없이 서킷 open/half-open 여부·
	// 실패율이 관측 가능해진다(지금까진 로그를 뒤져야만 알 수 있었다).
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Utilities
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers — Mockito 단위테스트만으로는 못 잡는, "실제 Postgres에 Flyway가 붙는지"
	// 자체를 검증한다(V15에서 발견한 VARCHAR 길이 버그 같은 건 스키마가 진짜로 있어야 드러난다).
	testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}
