dispatchmate_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USERNAME', 'faind') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME', 'faind') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
      retries: 2
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
