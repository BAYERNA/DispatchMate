name: CI

# Phase 8: PR #1은 처음부터 "CI 없음(0 statuses)"이었다 — Phase 7에서 만든 자동화 테스트
# (backend 17개 / ai-server 12개 / notification-server 8개)가 이 워크플로우가 생기기 전까지는
# 로컬에서만 돌았다. 6개 런타임을 각자 독립된 job으로 검증해, 어느 하나가 깨져도 나머지는
# 계속 결과를 볼 수 있게 한다.
on:
  # PR이 열려 있는 브랜치에 push하면 push/pull_request 두 이벤트가 동시에 발생해 같은 커밋을
  # 두 번 돌리게 된다 — push는 main 직접 반영(머지 후)만 잡고, 브랜치 작업은 pull_request로 커버.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 21 / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 이번에 추가한 테스트(IncidentService/IncidentConfirmService/Device)는 전부 Mockito
      # 단위 테스트라 실 DB가 필요 없다 — Postgres 서비스 컨테이너를 띄우지 않는다.
      - run: ./gradlew test compileJava --no-daemon

  ai-server:
    name: ai-server (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # tests/test_yolo_service.py는 실제 YOLO 가중치 없이도 도는 순수 계산 테스트라
      # 모델 파일을 내려받거나 GPU를 준비할 필요가 없다.
      - run: pytest tests/ -v
      # ai-server/README.md에 이미 문서화된 기존 취약점(starlette/langgraph 등, 메이저 업그레이드
      # 필요)을 막지는 않는다 — pip-audit은 npm처럼 심각도 임계값 옵션이 없어서 완전히 차단하면
      # 매번 실패한다. 대신 매 커밋마다 결과를 로그로 남겨 새로 추가되는 취약점을 눈에 띄게 한다.
      - name: 의존성 취약점 점검 (정보성 — 결과가 있어도 빌드를 막지 않음)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock.txt

  notification-server:
    name: notification-server (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: notification-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      # notification-server/README.md에 이미 문서화된 기존 취약점(NestJS 10→11 메이저 업그레이드
      # 필요)은 대부분 moderate/high라 critical 임계값에서는 안 걸린다 — 새로 critical급이
      # 추가되는 경우만 빌드를 막는다.
      - run: npm audit --audit-level=critical

  admin-web:
    name: admin-web (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      # Phase 9에서 추가한 jsdom@30/vitest@5가 Node 22.22+를 요구한다(20에서는
      # "webidl.util.markAsUncloneable is not a function"으로 vitest worker가 죽는다) —
      # 프론트엔드 3개 job만 22로 올린다. notification-server는 jsdom을 안 써서 20 그대로 둔다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # 3개 프론트엔드가 packages/design-system(공유 CSS)을 npm workspace로 참조해서, 루트에서
      # 한 번에 설치해야 한다 — admin-web 디렉터리만으로는 npm ci가 워크스페이스를 못 찾는다.
      - name: 워크스페이스 전체 설치
        working-directory: .
        run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test
      - run: npm audit --audit-level=critical

  commander-tablet:
    name: commander-tablet (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commander-tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 워크스페이스 전체 설치
        working-directory: .
        run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test
      - run: npm audit --audit-level=critical

  responder-app:
    name: responder-app (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: responder-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 워크스페이스 전체 설치
        working-directory: .
        run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test
      - run: npm audit --audit-level=critical

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Phase 10: 지금까지 매 Phase마다 수동으로 해온 브라우저 검증(로그인 성공/실패, 보호된
    # 화면 접근)을 코드화했다. 3개 프론트엔드가 공유하는 backend+notification-server를 이
    # job 하나에서 한 번만 띄우고, 그 위에서 세 앱의 Playwright 스위트를 차례로 돌린다
    # (3개 job으로 쪼개면 backend를 세 번 띄우게 되어 낭비다).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: faind
          POSTGRES_USER: faind
          POSTGRES_PASSWORD: faind
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U faind -d faind"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: e2e-ci-secret-key-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            notification-server/package-lock.json
            package-lock.json

      # 3개 프론트엔드가 packages/design-system(공유 CSS)을 npm workspace로 참조한다 —
      # 루트에서 한 번에 설치해야 세 앱 + 공유 패키지가 전부 링크된다.
      - name: 프론트엔드 워크스페이스 전체 설치
        run: npm ci

      - name: backend 빌드·기동 (Flyway 마이그레이션 포함)
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon
          nohup java -jar build/libs/*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "backend가 기동하지 못했다"; cat /tmp/backend.log; exit 1
        env:
          DB_URL: jdbc:postgresql://localhost:5432/faind
          DB_USERNAME: faind
          DB_PASSWORD: faind
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: notification-server 빌드·기동
        working-directory: notification-server
        run: |
          npm ci
          npm run build
          nohup node dist/main > /tmp/notification-server.log 2>&1 &
          for i in $(seq 1 15); do
            (echo > /dev/tcp/localhost/3001) 2>/dev/null && exit 0
            sleep 2
          done
          echo "notification-server가 기동하지 못했다"; cat /tmp/notification-server.log; exit 1
        env:
          DB_HOST: localhost
          DB_USERNAME: faind
          DB_PASSWORD: faind
          DB_NAME: faind

      # 세 앱 모두 scripts/seed-e2e-accounts.sql(psql)·레이트리미팅 카운터 초기화(redis-cli)를
      # globalSetup에서 직접 실행한다 — ubuntu-latest 러너에는 둘 다 기본 설치돼 있다.
      - name: admin-web E2E
        working-directory: admin-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: commander-tablet E2E
        working-directory: commander-tablet
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: responder-app E2E
        working-directory: responder-app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: 실패 시 Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin-web/playwright-report
            commander-tablet/playwright-report
            responder-app/playwright-report
          retention-days: 7

  docker-smoke-test:
    name: Docker Compose 스모크 테스트
    runs-on: ubuntu-latest
    # 위의 e2e job은 backend/notification-server를 raw 프로세스로, 3개 프론트엔드는 vite dev
    # server로 띄워서 검증한다 — docker-compose.yml/각 앱의 Dockerfile·nginx.conf는 그 어떤 job도
    # 실제로 빌드·기동해본 적이 없다. 그래서 nginx 오리진(8081~8083)에서 로그인이 CORS 403으로
    # 막히던 실제 버그(docker-compose.yml의 backend CORS_ALLOWED_ORIGINS 설정 누락)를 이 워크플로우가
    # 못 잡고 라이브 테스트에서야 발견됐었다 — 이 job은 그 경로(Docker 빌드 + nginx 프록시 + CORS)를
    # 실제로 재현해서 검증한다.
    steps:
      - uses: actions/checkout@v4
      - name: 전체 스택 빌드·기동
        run: docker compose up -d --build
      - name: backend 헬스체크 대기
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          echo "backend가 기동하지 못했다"; docker compose logs backend; exit 1
      # scripts/seed-e2e-accounts.sql은 e2e job의 global-setup.ts가 쓰는 것과 동일한 파일이다.
      - name: E2E 계정 시드
        run: docker compose exec -T postgres psql -U faind -d faind < scripts/seed-e2e-accounts.sql
      - name: 각 프론트엔드 nginx 오리진 경유 로그인 스모크 테스트 (CORS/프록시 설정 검증)
        run: |
          declare -A PORTS=( [admin-web]=8081 [commander-tablet]=8082 [responder-app]=8083 )
          for name in "${!PORTS[@]}"; do
            port=${PORTS[$name]}
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:$port/api/v1/auth/login" \
              -H "Content-Type: application/json" -H "Origin: http://localhost:$port" \
              -d '{"badgeNumber":"E2E-ADMIN","password":"Test1234!"}')
            echo "$name (:$port) 로그인 → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "실패 — nginx 프록시/CORS 설정을 확인하라"
              docker compose logs backend "$name"
              exit 1
            fi
          done
      - name: 정리
        if: always()
        run: docker compose down -v
