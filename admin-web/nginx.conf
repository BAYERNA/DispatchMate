# dev server의 vite.config.ts 프록시 규칙과 동일한 라우팅을 프로덕션 빌드에서 nginx로 재현한다.
# 브라우저는 이 nginx 오리진 하나만 보므로 CORS 설정이 필요 없다(서버 간 프록시는 CORS 대상이 아님).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /notify/ {
        rewrite ^/notify/(.*)$ /$1 break;
        proxy_pass http://notification-server:3001;
        proxy_set_header Host $host;
    }

    # ADM-010 전체 CCTV 상시 감시(Phase 4) — ai-server의 MJPEG 중계·위험도 스냅샷 엔드포인트.
    # proxy_buffering이 기본값(on)이면 nginx가 응답을 버퍼에 다 채운 뒤에야 클라이언트로 흘려보내는데,
    # multipart/x-mixed-replace처럼 끝나지 않는 스트림에서는 이게 프레임이 뭉쳐서 지연되는 형태로
    # 나타난다(ai-server 쪽 캡처 버퍼를 아무리 줄여도 여기서 다시 막힌다) — 꺼서 프레임이 나오는 대로
    # 바로 전달한다.
    location /ai-stream/ {
        rewrite ^/ai-stream/(.*)$ /api/v1/streams/$1 break;
        proxy_pass http://ai-server:8001;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # BrowserRouter를 쓰므로 새로고침·직접 진입 시에도 index.html로 폴백해야 한다.
    location / {
        try_files $uri /index.html;
    }
}
